[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexmeter"
dynamic = ["version"]
description = "Windows/macOS companion and ESP32 display for Codex subscription limits."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["codex", "esp32", "ble", "windows", "macos", "platformio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "bleak==3.0.2",
  "pyserial>=3.5,<4; sys_platform == 'win32'",
  "pystray==0.19.5; sys_platform == 'win32'",
  "pillow>=11,<14; sys_platform == 'win32'",
  "winrt-Windows.Devices.Radios>=3,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
hardware = ["pillow>=11,<14"]

[project.urls]
Homepage = "https://github.com/tomatoeggs/CodexMeter"
Repository = "https://github.com/tomatoeggs/CodexMeter.git"
Issues = "https://github.com/tomatoeggs/CodexMeter/issues"
Changelog = "https://github.com/tomatoeggs/CodexMeter/blob/main/CHANGELOG.md"

[project.scripts]
codexmeterd = "codexmeter.daemon:main"
codexmeterctl = "codexmeter.cli:main"

[tool.setuptools.packages.find]
include = ["codexmeter*"]

[tool.setuptools.dynamic]
version = {attr = "codexmeter.__version__"}
