[platformio]
build_dir = D:/build/CodexMeter/ball-probe-build
libdeps_dir = D:/build/CodexMeter/ball-probe-libdeps
[env:ball_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
lib_deps =
  moononournation/GFX Library for Arduino@1.6.6
  h2zero/NimBLE-Arduino@2.5.0
upload_speed = 921600
monitor_speed = 115200
